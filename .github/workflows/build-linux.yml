name: Build Linux package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: bash build.sh

      - name: Package
        run: tar -czf EmbededConfigurator-linux-x86_64.tar.gz -C dist EmbededConfigurator

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbededConfigurator-linux-x86_64
          path: EmbededConfigurator-linux-x86_64.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EmbededConfigurator-linux-x86_64.tar.gz
